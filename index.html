<script>
const KEY='story-lab-v1';
const DIRS={
concept:['컨셉 발전','이 한 줄짜리 원석의 핵심을 유지하면서 서로 다른 이야기 축으로 발전시켜라. 주인공의 정체, 관계, 제약, 이해관계, 역할 역전, 시간 압박, 도덕적 딜레마, 사건의 의미 등을 다양하게 활용하되 단순히 장르만 바꾸지 마라.'],
natural:['자연스럽게','현재까지 확립된 인물의 목표, 욕망, 갈등, 정보와 인과관계에서 가장 자연스럽게 발생할 수 있는 다음 사건을 제안하라. 편의를 위한 우연이나 갑작스러운 새 설정보다 기존 요소의 결과를 우선하라.'],
goal:['목표 강화','현재까지의 사건으로 인해 인물이 원하는 것이 더 명확하고 구체적이며 절박해지는 전개를 제안하라. 새로운 목표를 무작정 추가하기보다 기존 욕망, 문제, 관계에서 더 강한 목표가 발생하게 하라. 가능하면 인물이 수동적으로 사건을 겪는 것이 아니라 스스로 다음 행동을 선택하게 만들어라.'],
twist:['의외로 꺾기','뜬금없는 반전이 아니라 이미 존재하는 정보, 관계, 목표, 오해의 의미를 다르게 이용해 예상 밖의 방향으로 꺾어라. 숨겨진 쌍둥이처럼 근거 없는 새 설정으로 놀라게 하지 마라.'],
worse:['상황 악화','현재 문제가 쉽게 해결되지 않도록 상황을 악화시키는 다음 사건을 제안하라. 가능하면 기존 인물의 선택, 욕망, 실수, 이해관계가 문제를 키우게 하고 단순 사고나 갑작스러운 악당 투입에 의존하지 마라.'],
fail:['목표 실패','현재 인물이 원하는 것을 얻지 못하게 하되 단순 좌절로 끝내지 말고, 그 실패가 새로운 문제·선택·목표를 발생시키는 전개를 제안하라.'],
cost:['대가 치르기','인물이 원하는 것을 얻거나 문제를 해결하지만 그 선택 때문에 다른 중요한 것—관계, 신뢰, 안전, 정보, 기회, 가치—을 잃게 되는 전개를 제안하라.'],
relation:['관계 변화','사건의 규모를 억지로 키우기보다 기존 인물 사이의 신뢰, 의심, 동맹, 적대, 의존, 경쟁 관계가 실제 행동 때문에 변화하는 다음 전개를 제안하라.'],
secret:['비밀·정보','새로운 정보가 드러나거나 이미 알려진 정보의 의미가 바뀌어 인물의 판단과 상황이 달라지는 전개를 제안하라. 필요 없는 새 설정을 무작정 추가하지 말고 기존 맥락과 연결하라.'],
third:['제3자 개입','현재 대립이나 선택에 기존의 다른 인물·세력·이해관계자가 개입하여 힘의 균형과 선택지를 바꾸는 전개를 제안하라. 단순 구원이나 방해가 아니라 각자의 목적이 드러나게 하라.'],
escalate:['판 키우기','현재 사건의 위험, 책임, 이해관계 또는 영향 범위를 한 단계 확장하라. 규모만 크게 만드는 대신 주인공이 감당해야 할 선택과 결과가 더 무거워지게 하라.'],
shake:['🎲 사고 흔들기','현재 이야기의 핵심과 개연성은 유지하되 창작자가 아직 생각하지 않았을 법한 축을 찾아 전개 가능성을 넓혀라. 서로 다른 원리의 아이디어를 제시하고 단순한 랜덤 사건 나열은 피하라.']};
const COMMON=`당신은 이야기를 대신 집필하는 작가가 아니라
스토리의 가능성을 넓히는 브레인스토밍 파트너다.

[출력 규칙]
- 서로 다른 후보를 {{COUNT}}개 제안한다.
- 각 후보는 서로 독립된 코드 블록 하나에만 작성한다.
- 코드 블록 안에는 번호, 제목, 불릿, 접두어를 넣지 않는다.
- 한 후보에는 하나의 핵심 사건, 변화, 발견, 선택과 그 직접적인 결과까지만 담는다.
- 그 이후의 추가 전개나 해결책까지 미리 진행하지 않는다.
- 한 후보는 가능하면 한 문장으로 짧게 작성한다.
- 후보를 읽은 사람이 "그러면 다음에는 어떻게 되지?"라고 생각할 여지를 남긴다.
- 대사, 장면 묘사, 소설식 문체, 결말, 장황한 해설은 쓰지 않는다.
- 서로 비슷한 아이디어의 변형으로 개수를 채우지 않는다.
- 각 후보는 이후 이야기를 서로 다른 방향으로 진행시킬 수 있어야 한다.
- 긴 문장은 가로 스크롤 없이 읽기 쉽도록 의미 단위로 줄바꿈한다.
- 코드 블록 밖에 설명이나 평가를 덧붙이지 않는다.`
const STORY_PROMPT=`당신은 아래의 이야기 탐색 기록을 바탕으로 하나의 완결된 스토리 구조를 설계하는 스토리 편집자다.

아래 내용은 확정된 시놉시스가 아니라 이야기를 탐색하면서 선택한 아이디어들의 경로다.
모든 내용을 반드시 사용할 필요는 없다.

[정리 규칙]
- [반드시 살릴 핵심 아이디어]에 포함된 내용은 완성된 이야기에서 반드시 유지한다.
- 핵심 아이디어의 표현, 위치, 세부 인과관계는 자연스럽게 수정할 수 있지만 핵심 의미 자체는 삭제하거나 다른 의미로 바꾸지 않는다.
- 이야기 탐색 기록의 나머지 요소는 필요에 따라 삭제, 통합, 수정할 수 있다.
- 중복되거나 흐름을 방해하는 요소는 제거한다.
- 인과관계가 약한 부분은 자연스럽게 수정한다.
- 필요한 연결 사건이나 정보가 빠져 있다면 추가한다.
- 앞에서 제시된 설정과 충돌하는 부분은 정리한다.
- 입력된 사건들을 단순히 순서대로 이어 붙이지 않는다.
- 주인공의 목표와 선택이 이야기의 진행을 이끌도록 재구성한다.
- 갈등이 발전하고 중요한 선택을 거쳐 결말에 도달하도록 구성한다.
- 원래 아이디어의 핵심적인 매력은 유지한다.
- 새로운 설정을 과도하게 추가하여 전혀 다른 이야기로 만들지 않는다.

[출력]
완성된 이야기를 기승전결이 보이는 시놉시스 형태로 작성한다.
필요하다면 입력에 없던 연결 사건을 추가하고 불필요한 사건은 과감하게 제외한다.`;
const SERIES_COMMON=COMMON+`\n- 시리즈 전체를 너무 빨리 완결시키기보다 이후 에피소드와 관계 변화가 이어질 여지를 남긴다.`;
const WEBNOVEL_COMMON=COMMON+`\n- 웹소설 연재를 염두에 두고 인물의 능동적인 목표, 보상, 위기와 다음 전개를 궁금하게 만드는 동력을 우선한다.`;
const SERIES_STORY=STORY_PROMPT.replace('하나의 완결된 스토리 구조를 설계하는 스토리 편집자다.','하나의 완결된 시리즈 구조를 설계하는 스토리 편집자다.').replace('완성된 이야기를 기승전결이 보이는 시놉시스 형태로 작성한다.','완성된 이야기를 시리즈 전체의 큰 기승전결이 보이는 시놉시스 형태로 작성한다. 주요 관계와 갈등이 단계적으로 변화하고 여러 에피소드로 확장될 여지를 유지한다.');
const WEBNOVEL_STORY=STORY_PROMPT.replace('하나의 완결된 스토리 구조를 설계하는 스토리 편집자다.','장기 연재 가능한 하나의 완결된 웹소설 구조를 설계하는 스토리 편집자다.').replace('완성된 이야기를 기승전결이 보이는 시놉시스 형태로 작성한다.','완성된 이야기를 웹소설 장기 연재의 큰 기승전결이 보이는 시놉시스 형태로 작성한다. 주인공의 지속적인 목표와 성장, 보상과 위기, 다음 구간으로 이어지는 동력을 분명히 한다.');
function basePrompts(extra=''){return Object.fromEntries(Object.entries(DIRS).map(([k,v])=>[k,v[1]+extra]))}
function defaultPresets(){return [
{id:'movie',name:'영화',common:COMMON,storyPrompt:STORY_PROMPT,prompts:basePrompts()},
{id:'series',name:'시리즈',common:SERIES_COMMON,storyPrompt:SERIES_STORY,prompts:basePrompts(' 시리즈 형식에 맞게 한 번의 사건으로 모든 것을 끝내기보다 관계와 갈등이 다음 에피소드로 발전할 여지를 남겨라.')},
{id:'webnovel',name:'웹소설',common:WEBNOVEL_COMMON,storyPrompt:WEBNOVEL_STORY,prompts:basePrompts(' 웹소설 연재 흐름에 맞게 주인공의 능동적인 선택, 보상과 위기, 다음 전개를 계속 궁금하게 만드는 동력을 우선하라.')}
]}
function freshState(){return{projects:[],activeProject:null,activeNode:null,settings:{count:8,context:'all',activePreset:'movie',presets:defaultPresets()}}}
let state=load()||freshState();
let ui={projects:true,detail:true};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function proj(){return state.projects.find(p=>p.id===state.activeProject)}function node(id=state.activeNode){return proj()?.nodes.find(n=>n.id===id)}function children(id){return proj().nodes.filter(n=>n.parent===id)}function pathTo(id=state.activeNode){let p=proj(),out=[],n=p?.nodes.find(x=>x.id===id);while(n){out.unshift(n);n=p.nodes.find(x=>x.id===n.parent)}return out}
function newProject(){openModal('새 프로젝트',`<label class="label">짧은 제목</label><input id="newTitle" class="field" placeholder="예: 건너편 살인" maxlength="30"><label class="label">첫 아이디어</label><textarea id="newSeed" class="field" rows="6" placeholder="첫 컨셉 한 줄"></textarea>`,`<button class="btn primary" id="newProjectOk">추가</button>`);setTimeout(()=>{document.getElementById('newTitle').focus();document.getElementById('newProjectOk').onclick=()=>{let title=document.getElementById('newTitle').value.trim(),v=document.getElementById('newSeed').value.trim();if(!title||!v){toast('제목과 첫 아이디어를 입력하세요');return}let id=uid(),nid=uid();state.projects.unshift({id,title:title.slice(0,30),created:Date.now(),nodes:[{id:nid,parent:null,text:v,star:false,excluded:false,created:Date.now()}]});state.activeProject=id;state.activeNode=nid;save();closeModal();render()}})}
function selectProject(id){state.activeProject=id;let p=proj();state.activeNode=p?.nodes[0]?.id||null;save();render();closeModal()}function renameProject(id){let p=state.projects.find(x=>x.id===id);if(!p)return;showForm('프로젝트 이름 수정','프로젝트 이름',p.title,v=>{p.title=v.slice(0,80)||p.title;save();render()})}function deleteProject(id=state.activeProject){let p=state.projects.find(x=>x.id===id);if(!p||!confirm(`'${p.title}' 프로젝트를 삭제할까요?`))return;state.projects=state.projects.filter(x=>x.id!==p.id);if(state.activeProject===p.id){state.activeProject=state.projects[0]?.id||null;state.activeNode=proj()?.nodes[0]?.id||null}save();render();closeModal()}
function render(){renderProjects();renderTree();renderDetail();applyPanels()}function renderProjects(){let el=document.getElementById('projectList');el.innerHTML=state.projects.map(p=>`<div class="project ${p.id===state.activeProject?'active':''}" onclick="selectProject('${p.id}')"><div class="projectMain">${esc(p.title)}<small>${p.nodes.length} nodes</small></div><div class="projectActions"><button class="iconBtn" title="이름 수정" onclick="event.stopPropagation();renameProject('${p.id}')">✎</button><button class="iconBtn delete" title="프로젝트 삭제" onclick="event.stopPropagation();deleteProject('${p.id}')">✕</button></div></div>`).join('')||'<div class="hint" style="padding:10px">아직 프로젝트가 없습니다.</div>'}
function renderTree(){let p=proj(),el=document.getElementById('tree');if(!p){el.innerHTML='<div class="empty"><div><b>한 줄에서 시작하세요.</b><br><br><button class="btn primary" onclick="newProject()">＋ 새 프로젝트</button></div></div>';return}let ordered=[],branchSeq=0;function walk(n,branch=0){ordered.push({n,branch});let kids=children(n.id);kids.forEach((c,i)=>{let nextBranch=i===0?branch:(++branchSeq%4||4);walk(c,nextBranch)})}p.nodes.filter(n=>!n.parent).forEach((n,i)=>walk(n,i?((++branchSeq%4)||4):0));let stepById=new Map(ordered.map((x,i)=>[x.n.id,i+1])),links=new Map();p.nodes.forEach(parent=>{let kids=children(parent.id);if(kids.length>1){kids.slice(1).forEach(child=>{let label=`${stepById.get(parent.id)} → ${stepById.get(child.id)}`;if(!links.has(parent.id))links.set(parent.id,[]);links.get(parent.id).push(label);links.set(child.id,[label])})}});el.innerHTML=`<div class="treeCanvas">${ordered.map((x,i)=>nodeCard(x.n,i+1,x.branch,links.get(x.n.id)||[])).join('')}</div>`}
function nodeCard(n,step,branch,branchLinks=[]){return `<div class="nodeWrap"><div class="node ${branch?'branch'+branch:''} ${n.id===state.activeNode?'active':''} ${n.excluded?'excluded':''} ${n.star?'starred':''}" onclick="selectNode('${n.id}')">${esc(n.text)}<div class="meta"><span class="nodeStep">${step}</span>${branchLinks.map(x=>`<span class="branchLink">${x}</span>`).join('')}${n.star?'<span class="star">★ 핵심</span>':''}${n.excluded?'<span class="excludeMark">⊘ 제외</span>':''}</div></div></div>`}
function selectNode(id){state.activeNode=id;save();renderTree();renderDetail()}function renderDetail(){let el=document.getElementById('detailBody'),n=node();if(!n){el.innerHTML='<div class="hint">노드를 선택하세요.</div>';return}el.innerHTML=`<textarea class="field" rows="5" onchange="editNode('text',this.value)">${esc(n.text)}</textarea><div class="actions"><button class="btn primary" onclick="addChild()">＋ 다음 전개</button><button class="btn" onclick="copyPath()">현재 경로 복사</button><button class="btn" onclick="toggleStar()">${n.star?'★ 핵심':'☆ 핵심'}</button><button class="btn" onclick="toggleExclude()">${n.excluded?'⊘ 제외됨':'⊘ 제외'}</button></div><label class="label">AI 발산</label><div class="aiGrid">${Object.entries(DIRS).map(([k,v])=>`<button class="btn aiBtn" onclick="copyPrompt('${k}')">${v[0]}</button>`).join('')}</div>`}
function editNode(k,v){let n=node();if(!n)return;n[k]=v;save();renderTree()}function addChild(){if(!node())return;showForm('다음 전개 추가','GPT에서 고른 후보를 붙여넣거나 직접 작성','',v=>{let n={id:uid(),parent:state.activeNode,text:v,star:false,excluded:false,created:Date.now()};proj().nodes.push(n);state.activeNode=n.id;save();render()})}function toggleStar(){let n=node();if(!n)return;n.star=!n.star;if(n.star)n.excluded=false;save();render()}function toggleExclude(){let n=node();if(!n)return;n.excluded=!n.excluded;if(n.excluded)n.star=false;save();render()}function deleteNode(){let n=node(),p=proj();if(!n||!p)return;if(!n.parent){toast('첫 노드는 삭제할 수 없습니다');return}if(!confirm('이 노드와 아래의 모든 분기를 삭제할까요?'))return;let ids=new Set([n.id]),changed=true;while(changed){changed=false;p.nodes.forEach(x=>{if(x.parent&&ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}let parent=n.parent;p.nodes=p.nodes.filter(x=>!ids.has(x.id));state.activeNode=parent;save();render()}
function activePreset(){return state.settings.presets.find(p=>p.id===state.settings.activePreset)||state.settings.presets[0]}function contextNodes(){let a=pathTo();let c=state.settings.context;if(c==='3')return a.slice(-3);if(c==='5')return a.slice(-5);return a}async function copyPrompt(k){let n=node();if(!n)return;let ps=activePreset(),ctx=contextNodes().map((x,i)=>`${i+1}. ${x.text}`).join('\n');let p=`${ps.common.replace('{{COUNT}}',state.settings.count)}\n\n[이번 발산 방향: ${DIRS[k][0]}]\n${ps.prompts[k]||DIRS[k][1]}\n\n[지금까지의 세계선]\n${ctx}\n\n[현재 지점]\n${n.text}`;await clip(p);toast(`${DIRS[k][0]} · ${ps.name}`)}async function copyPath(){if(!node())return;await clip(pathTo().map((n,i)=>`${i+1}. ${n.text}`).join('\n'));toast('현재 경로 복사')}async function copyStoryPrompt(){if(!node())return;let ps=activePreset(),path=pathTo(),usable=path.filter(n=>!n.excluded),stars=usable.filter(n=>n.star);let core=stars.length?stars.map(n=>`- ${n.text}`).join('\n'):'- 없음';let record=usable.map((n,i)=>`${i+1}. ${n.text}`).join('\n');let prompt=`${ps.storyPrompt||STORY_PROMPT}\n\n[반드시 살릴 핵심 아이디어]\n${core}\n\n[이야기 탐색 기록]\n${record}`;await clip(prompt);toast(`스토리 · ${ps.name}`)}
function applyPanels(){let l=document.getElementById('layout');if(!l)return;l.classList.toggle('hideProjects',!ui.projects);l.classList.toggle('hideDetail',!ui.detail);document.getElementById('toggleProjectsBtn')?.classList.toggle('active',ui.projects);document.getElementById('toggleDetailBtn')?.classList.toggle('active',ui.detail)}function toggleProjectsPanel(){ui.projects=!ui.projects;applyPanels()}function toggleDetailPanel(){ui.detail=!ui.detail;applyPanels()}
function openProjects(){openModal('프로젝트',`<button class="btn primary" onclick="closeModal();newProject()">＋ 새 프로젝트</button><div style="height:10px"></div>${state.projects.map(p=>`<div class="project ${p.id===state.activeProject?'active':''}" onclick="selectProject('${p.id}')"><div class="projectMain">${esc(p.title)}<small>${p.nodes.length} nodes</small></div><div class="projectActions"><button class="iconBtn" onclick="event.stopPropagation();renameProject('${p.id}')">✎</button><button class="iconBtn delete" onclick="event.stopPropagation();deleteProject('${p.id}')">✕</button></div></div>`).join('')||'<div class="hint">프로젝트 없음</div>'}`,`<button class="btn" onclick="importProject()">프로젝트 불러오기</button>`)}function openDetail(){let n=node();if(!n)return;openModal('선택 노드',document.getElementById('detailBody').innerHTML,'')}
function settingsHtml(){let s=state.settings,ps=activePreset();return `<div class="settingsRow"><b>AI 출력</b><div><label class="label">후보 개수</label><select id="setCount" class="field"><option ${s.count==5?'selected':''}>5</option><option ${s.count==8?'selected':''}>8</option><option ${s.count==10?'selected':''}>10</option></select><label class="label">세계선 문맥</label><select id="setContext" class="field"><option value="3" ${s.context==='3'?'selected':''}>최근 3단계</option><option value="5" ${s.context==='5'?'selected':''}>최근 5단계</option><option value="all" ${s.context==='all'?'selected':''}>전체</option></select><label class="label">프롬프트 프리셋</label><div class="presetBar"><select id="setPreset" class="field" onchange="switchPreset(this.value)">${s.presets.map(p=>`<option value="${p.id}" ${p.id===s.activePreset?'selected':''}>${esc(p.name)}</option>`).join('')}</select><button class="btn" onclick="clonePreset()">복제</button><button class="btn" onclick="renamePresetSetting()">이름 변경</button><button class="btn danger" onclick="deletePresetSetting()">삭제</button></div></div></div><div class="settingsRow"><b>공통 프롬프트</b><textarea id="setCommon" class="field" rows="10">${esc(ps.common)}</textarea></div><div class="settingsRow"><b>스토리 프롬프트</b><textarea id="setStoryPrompt" class="field" rows="14">${esc(ps.storyPrompt||STORY_PROMPT)}</textarea></div><div class="settingsRow"><b>발산 프롬프트</b><div class="promptList">${Object.entries(DIRS).map(([k,v])=>`<details class="promptEdit"><summary>${v[0]}</summary><textarea id="prompt_${k}" class="field">${esc(ps.prompts[k]||v[1])}</textarea></details>`).join('')}</div></div><div class="settingsRow"><b>데이터</b><div class="dataRows"><div class="dataRow"><button class="btn" onclick="backupAll()">전체 백업</button><button class="btn" onclick="restoreAll()">전체 복원</button><button class="btn" onclick="exportProject()">프로젝트 백업</button><button class="btn" onclick="importProject()">프로젝트 복원</button></div><div class="dataRow"><button class="btn" onclick="exportText('md')">전체 MD</button><button class="btn" onclick="exportText('txt')">전체 TXT</button></div></div></div>`}
function openSettings(){openModal('설정',settingsHtml(),`<button class="btn danger" onclick="resetAll()">초기화</button><button class="btn primary" onclick="saveSettings()">저장</button>`)}
function capturePresetForm(){let ps=activePreset();let c=document.getElementById('setCommon');if(!c)return;ps.common=c.value;ps.storyPrompt=document.getElementById('setStoryPrompt').value;Object.keys(DIRS).forEach(k=>ps.prompts[k]=document.getElementById('prompt_'+k).value);state.settings.count=+document.getElementById('setCount').value;state.settings.context=document.getElementById('setContext').value}
function refreshSettingsBody(){document.getElementById('modalBody').innerHTML=settingsHtml()}
function switchPreset(id){capturePresetForm();state.settings.activePreset=id;save();refreshSettingsBody();toast(`${activePreset().name} 프리셋`)}
function clonePreset(){capturePresetForm();let src=activePreset(),id=uid(),p=JSON.parse(JSON.stringify(src));p.id=id;p.name=src.name+' 복사본';state.settings.presets.push(p);state.settings.activePreset=id;save();refreshSettingsBody()}
function renamePresetSetting(){capturePresetForm();let ps=activePreset(),v=prompt('프리셋 이름',ps.name);if(!v||!v.trim())return;ps.name=v.trim();save();refreshSettingsBody()}
function deletePresetSetting(){if(state.settings.presets.length<=1){toast('프리셋은 하나 이상 필요합니다');return}let ps=activePreset();if(!confirm(`'${ps.name}' 프리셋을 삭제할까요?`))return;let i=state.settings.presets.findIndex(p=>p.id===ps.id);state.settings.presets.splice(i,1);state.settings.activePreset=state.settings.presets[Math.max(0,i-1)].id;save();refreshSettingsBody()}
function saveSettings(){capturePresetForm();save();closeModal();toast(`${activePreset().name} 프리셋 저장`)}function resetAll(){if(!confirm('LAB의 모든 프로젝트, 노드, 프롬프트, 설정을 삭제하고 최초 상태로 초기화할까요?'))return;localStorage.removeItem(KEY);state=freshState();save();closeModal();render();toast('전체 초기화 완료')}
function backupAll(){download('story-lab-backup.json',JSON.stringify(state,null,2),'application/json')}function restoreAll(){pickFile(obj=>{if(!obj.projects||!obj.settings)throw Error('형식 오류');state=obj;save();render();closeModal();toast('전체 복구 완료')})}function exportProject(){let p=proj();if(!p)return;download(safe(p.title)+'.story.json',JSON.stringify({type:'story-lab-project',version:1,project:p},null,2),'application/json')}function importProject(){pickFile(obj=>{let p=obj.type==='story-lab-project'?obj.project:obj.project;if(!p?.nodes)throw Error('프로젝트 형식 오류');p=JSON.parse(JSON.stringify(p));if(state.projects.some(x=>x.id===p.id)){let map={};p.nodes.forEach(n=>map[n.id]=uid());p.nodes.forEach(n=>{let old=n.id;n.id=map[old];if(n.parent)n.parent=map[n.parent]});p.id=uid();p.title+=' (불러옴)'}state.projects.unshift(p);state.activeProject=p.id;state.activeNode=p.nodes[0]?.id||null;save();render();closeModal();toast('프로젝트 불러오기 완료')})}
function treeText(){let p=proj();if(!p)return'';function walk(n,d){let marks=`${n.star?' [★ 핵심]':''}${n.excluded?' [⊘ 제외]':''}`;let out=`${'  '.repeat(d)}- ${n.text}${marks}\n`;children(n.id).forEach(c=>out+=walk(c,d+1));return out}return p.nodes.filter(n=>!n.parent).map(n=>walk(n,0)).join('\n')}function exportText(ext){let p=proj();if(!p)return;let text=`# ${p.title}\n\n${treeText()}\n`;download(`${safe(p.title)}_전체.${ext}`,text,'text/plain;charset=utf-8')}
function showForm(title,ph,val,done){openModal(title,`<textarea id="formValue" class="field" rows="6" placeholder="${ph}">${esc(val)}</textarea>`,`<button class="btn primary" id="formOk">추가</button>`);setTimeout(()=>{let f=document.getElementById('formValue');f.focus();document.getElementById('formOk').onclick=()=>{let v=f.value.trim();if(!v)return;closeModal();done(v)}},0)}function openModal(t,b,f=''){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modalFoot').innerHTML=f;document.getElementById('modalBack').classList.add('open')}function closeModal(){document.getElementById('modalBack').classList.remove('open')}document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function pickFile(cb){let inp=document.getElementById('fileInput');inp.value='';inp.onchange=async()=>{try{let obj=JSON.parse(await inp.files[0].text());cb(obj)}catch(e){alert('불러오기 실패: '+e.message)}};inp.click()}function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function safe(s){return(s||'project').replace(/[\\/:*?"<>|]/g,'_')}async function clip(t){try{await navigator.clipboard.writeText(t)}catch{let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}}

const OLD_COMMON_MARK='각 후보는 1~2문장으로 짧게 쓴다.';
if(!state.settings)state.settings=freshState().settings;
if(!state.settings.presets){let movie={id:'movie',name:'영화',common:state.settings.common||COMMON,storyPrompt:state.settings.storyPrompt||STORY_PROMPT,prompts:state.settings.prompts||basePrompts()};state.settings.presets=[movie,...defaultPresets().slice(1)];state.settings.activePreset='movie';delete state.settings.common;delete state.settings.storyPrompt;delete state.settings.prompts}
if(!state.settings.activePreset||!state.settings.presets.some(p=>p.id===state.settings.activePreset))state.settings.activePreset=state.settings.presets[0]?.id||'movie';
state.settings.presets.forEach(p=>{if(!p.prompts)p.prompts=basePrompts();Object.entries(DIRS).forEach(([k,v])=>{if(!p.prompts[k])p.prompts[k]=v[1]});if(!p.common)p.common=COMMON;if(p.common.includes(OLD_COMMON_MARK)||p.common.includes('한 후보에는 하나의 사건, 변화, 발견, 선택만 담는다.'))p.common=COMMON;if(!p.storyPrompt)p.storyPrompt=STORY_PROMPT});
if(!state.settings.count)state.settings.count=8;if(!state.settings.context)state.settings.context='all';state.projects.forEach(p=>p.nodes.forEach(n=>{if(n.excluded===undefined)n.excluded=false}));save();render();
</script><script>

  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
